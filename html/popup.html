
<div id="shell" style="width:288px;background:var(--bg,#18181b);color:var(--text,#efeff1);font-family:Inter,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;">
  <div style="padding:14px;">

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
      <img src="../assets/logo_128.png" width="34" height="34" alt="" style="width:34px;height:34px;border-radius:8px;object-fit:cover;flex:0 0 auto;background:var(--panel,#1f1f23);">
      <div style="min-width:0;">
        <div style="font-size:14px;font-weight:700;line-height:1.2;white-space:nowrap;">Twitch AdBlock</div>
        <div style="margin-top:2px;font-size:11px;font-weight:600;line-height:1.2;color:var(--accent,#a970ff);">+ Chat Analyzer</div>
      </div>
      <div style="margin-left:auto;display:flex;gap:4px;flex:0 0 auto;">
        <button type="button" id="t-dark" title="Dark" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;padding:0;border:1px solid var(--border,#2f2f35);border-radius:6px;background:transparent;">
          <svg width="13" height="13" viewBox="0 0 24 24" style="fill:var(--text,#efeff1);stroke:none;">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
          </svg>
        </button>
        <button type="button" id="t-light" title="Light" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;padding:0;border:1px solid var(--border,#2f2f35);border-radius:6px;background:transparent;">
          <svg width="13" height="13" viewBox="0 0 24 24" style="fill:var(--text,#efeff1);stroke:var(--text,#efeff1);">
            <circle cx="12" cy="12" r="4.4" stroke="none"></circle>
            <g stroke-width="1.9" stroke-linecap="round" fill="none">
              <line x1="12" y1="2" x2="12" y2="4.4"></line>
              <line x1="12" y1="19.6" x2="12" y2="22"></line>
              <line x1="2" y1="12" x2="4.4" y2="12"></line>
              <line x1="19.6" y1="12" x2="22" y2="12"></line>
              <line x1="4.9" y1="4.9" x2="6.6" y2="6.6"></line>
              <line x1="17.4" y1="17.4" x2="19.1" y2="19.1"></line>
              <line x1="19.1" y1="4.9" x2="17.4" y2="6.6"></line>
              <line x1="6.6" y1="17.4" x2="4.9" y2="19.1"></line>
            </g>
          </svg>
        </button>
      </div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 11px;margin-bottom:8px;background:var(--panel,#1f1f23);border:1px solid var(--border,#2f2f35);border-radius:7px;font-size:12px;">
      <span>Ad blocking</span>
      <span style="flex:0 0 auto;padding:3px 7px;border-radius:9px;background:var(--accent,#a970ff);color:var(--accent-text,#0e0e10);font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;">Always on</span>
    </div>

    <label style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 11px;margin-bottom:8px;background:var(--panel,#1f1f23);border:1px solid var(--border,#2f2f35);border-radius:7px;font-size:12px;cursor:pointer;">
      <span>Analyzer button</span>
      <input type="checkbox" id="an" checked="" style="width:16px;height:16px;accent-color:#a970ff;cursor:pointer;">
    </label>

    <button style="width:100%;padding:9px;border:1px solid var(--btn-border,#3d3d44);border-radius:7px;background:var(--panel,#1f1f23);color:var(--text,#efeff1);font-family:inherit;font-size:12px;font-weight:600;white-space:nowrap;">Clear saved analysis</button>

    <p style="margin:12px 0 0;font-size:10.5px;line-height:1.55;color:var(--muted,#7c7c85);">
      Open a channel and hit <b style="color:var(--text,#d5d5da);font-weight:600;">Analyze</b> next to Bits / Points.
    </p>

  </div>
</div>
